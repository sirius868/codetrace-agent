name: Offline verification
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      PYTHONUTF8: "1"
      LANGSMITH_TRACING: "false"
      LANGCHAIN_TRACING_V2: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-lock.txt
      - run: python -m pip install -r requirements-lock.txt
      - run: python -m pip install --no-deps --no-build-isolation -e .
      - run: python -m pip check
      - run: python -m pytest -q -rs
      - run: python -m codetrace --repo examples/demo_repo --offline --scenario entry
      - run: python -m codetrace --repo examples/demo_repo --offline --scenario cross-file --trace-dir runs
      - run: python -m codetrace --repo examples/demo_repo --offline --scenario config
      - run: python -m codetrace --repo examples/demo_repo --offline --scenario no-answer
      - run: python -m codetrace.evaluation
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: offline-results-${{ matrix.os }}
          path: runs/
