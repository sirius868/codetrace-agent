[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "codetrace-agent"
version = "0.1.0"
description = "A read-only repository assistant built with LangGraph"
requires-python = ">=3.12,<3.14"
dependencies = ["langgraph==1.2.16", "openai>=1.66.3,<2", "python-dotenv>=1,<2", "pydantic>=2.10,<3"]

[project.optional-dependencies]
indexed = ["tree-sitter==0.25.2", "tree-sitter-java==0.23.5"]
dev = ["pytest>=8.3,<9", "pytest-asyncio>=0.25,<1"]

[project.scripts]
codetrace = "codetrace.cli:main"
codetrace-eval = "codetrace.evaluation:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
